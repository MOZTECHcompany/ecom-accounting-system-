name: Deploy Backend to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'moztech-main-db' }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-east1' }}
  GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}
  ARTIFACT_REPOSITORY: ${{ vars.CLOUD_RUN_ARTIFACT_REPOSITORY || 'cloud-run' }}
  BACKEND_SERVICE: ${{ secrets.CLOUD_RUN_BACKEND_SERVICE || secrets.CLOUD_RUN_SERVICE || 'ecom-accounting-backend' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Google Cloud auth config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCP_WIF_PROVIDER}" || -z "${GCP_WIF_SERVICE_ACCOUNT}" ]]; then
            echo "::error::Missing GCP_WIF_PROVIDER or GCP_WIF_SERVICE_ACCOUNT. Add them to GitHub Actions Secrets or Variables."
            exit 1
          fi

      # Recommended: Workload Identity Federation (no JSON key in GitHub)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy backend
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:${GITHUB_SHA}"

          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --repository-format=docker \
            --location="${GCP_REGION}" \
            --description="Cloud Run containers for ecom-accounting-system"

          gcloud builds submit backend \
            --project="${GCP_PROJECT_ID}" \
            --tag="${IMAGE}"

          gcloud run deploy "${BACKEND_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --allow-unauthenticated \
            --port=3000

          # A prior tagged rollout left production traffic pinned to an old
          # revision even though newer revisions were healthy. Clear every
          # tag and make future deployments follow LATEST explicitly.
          gcloud run services update-traffic "${BACKEND_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --clear-tags \
            --to-latest \
            --quiet

          SERVICE_STATE="$(gcloud run services describe "${BACKEND_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='json(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)')"
          LATEST_READY="$(
            SERVICE_STATE="${SERVICE_STATE}" node <<'NODE'
          const state = JSON.parse(process.env.SERVICE_STATE || "{}");
          const status = state.status || {};
          const traffic = Array.isArray(status.traffic) ? status.traffic : [];
          if (
            !status.latestCreatedRevisionName
            || status.latestReadyRevisionName !== status.latestCreatedRevisionName
            || traffic.length !== 1
            || traffic[0]?.revisionName !== status.latestReadyRevisionName
            || traffic[0]?.latestRevision !== true
            || Number(traffic[0]?.percent) !== 100
            || traffic[0]?.tag
          ) {
            process.exit(2);
          }
          process.stdout.write(status.latestReadyRevisionName);
          NODE
          )"
          EXPECTED_IMAGE="$(gcloud artifacts docker images describe "${IMAGE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.fully_qualified_digest)')"
          DEPLOYED_IMAGE="$(gcloud run revisions describe "${LATEST_READY}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          if [[ -z "${EXPECTED_IMAGE}" || "${DEPLOYED_IMAGE}" != "${EXPECTED_IMAGE}" ]]; then
            echo "::error::Cloud Run serving revision does not match the image built by this run."
            exit 1
          fi

          URL="$(gcloud run services describe "${BACKEND_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
